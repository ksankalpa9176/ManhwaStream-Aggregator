name: Full Catalog Scan (one-time)

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max pages per source'
        required: false
        default: '200'

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        working-directory: scraper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full catalog scan
        working-directory: scraper
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FULL_SCAN_MAX_PAGES: ${{ github.event.inputs.max_pages }}
        run: python full_scan.py
